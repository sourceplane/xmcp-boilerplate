apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: XM-2
  title: "The MCP server on Workers"
spec:
  goal: Vercel's xmcp boilerplate runs as one stateless Cloudflare Worker built by xmcp build --cf — its tool, prompt and two resources over Streamable HTTP at /mcp — with its tests, and its README saying how it maps to Vercel
  affects:
    - apps/api
    - tests/api
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - README.md
  doneWhen:
    - pnpm typecheck, lint, test and build are green
    - wrangler dev answers an MCP client at /mcp — initialize, the tool, the prompt and both resources — and /health
  gates: []
